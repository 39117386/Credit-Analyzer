<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Fetch BCRA</title>
</head>
<body>
    <h1>Prueba Fetch BCRA API</h1>
    <div>
        <label for="cuit">CUIT:</label>
        <input type="text" id="cuit" value="20123456789" placeholder="Ingrese CUIT">
    </div>
    <button id="testBtn">Probar Fetch</button>
    <button id="testMockBtn">Probar Mock</button>
    <div id="result"></div>

    <script>
        // Función para limpiar CUIT
        function cleanCUIT(cuit) {
            return cuit.replace(/[^0-9]/g, '');
        }

        // Función mock
        function fetchDeudasMock(cuit) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const lastDigit = parseInt(cuit.slice(-1));
                    const nombres = ['Juan Carlos Pérez', 'María González', 'Carlos Rodríguez'];
                    const nombreAleatorio = nombres[Math.floor(Math.random() * nombres.length)];

                    let mockData;
                    if (lastDigit <= 3) {
                        mockData = {
                            denominacion: nombreAleatorio,
                            periodos: [{ entidades: [{ entidad: 'Banco Nación', situacion: 1, monto: 0 }] }]
                        };
                    } else {
                        mockData = {
                            denominacion: nombreAleatorio,
                            periodos: [{
                                entidades: [
                                    { entidad: 'Banco Nación', situacion: 3, monto: 50000 },
                                    { entidad: 'Santander', situacion: 2, monto: 25000 }
                                ]
                            }]
                        };
                    }

                    resolve(mockData);
                }, 1000);
            });
        }

        // Función real de fetch
        async function fetchDeudasReal(cuit) {
            const cleanedCUIT = cleanCUIT(cuit);
            const response = await fetch(`https://api.bcra.gob.ar/centraldedeudores/v1.0/Deudas/${cleanedCUIT}`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                },
                signal: AbortSignal.timeout(10000)
            });

            if (!response.ok) {
                if (response.status === 404) {
                    return {
                        denominacion: `CUIT ${cleanedCUIT}`,
                        periodos: []
                    };
                }
                throw new Error(`Error ${response.status}: ${response.statusText}`);
            }

            return await response.json();
        }

        document.getElementById('testBtn').addEventListener('click', async () => {
            const cuit = document.getElementById('cuit').value;
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '🔍 Probando API real...';

            try {
                const data = await fetchDeudasReal(cuit);
                resultDiv.textContent = `✅ API Real - Status: OK\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.textContent = `❌ Error API Real: ${error.message}`;
            }
        });

        document.getElementById('testMockBtn').addEventListener('click', async () => {
            const cuit = document.getElementById('cuit').value;
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '🎭 Probando Mock...';

            try {
                const data = await fetchDeudasMock(cuit);
                resultDiv.textContent = `✅ Mock - OK\n${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.textContent = `❌ Error Mock: ${error.message}`;
            }
        });
    </script>
</body>
</html>
