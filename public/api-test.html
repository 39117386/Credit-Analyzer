<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba API BCRA - Deuda Check</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
        }
        .error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        .success {
            border-left-color: #28a745;
            background: #d4edda;
        }
        pre {
            background: #f1f3f4;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 14px;
            line-height: 1.4;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        .test-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .test-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .test-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Prueba API BCRA - Deuda Check</h1>

        <div class="form-group">
            <label for="cuit">CUIT (11 dígitos):</label>
            <input type="text" id="cuit" placeholder="Ej: 20123456789 o 20-12345678-9" maxlength="13">
        </div>

        <button onclick="testAPI()">🔍 Consultar API</button>

        <div class="test-buttons">
            <button class="test-btn" onclick="setTestCUIT('20123456780')">Sin deudas (termina en 0)</button>
            <button class="test-btn" onclick="setTestCUIT('20123456783')">Sin deudas (termina en 3)</button>
            <button class="test-btn" onclick="setTestCUIT('20-12345678-5')">Deudas moderadas (con guiones)</button>
            <button class="test-btn" onclick="setTestCUIT('20123456788')">Deudas altas (termina en 8)</button>
            <button class="test-btn" onclick="setTestCUIT('99999999999')" style="background: #17a2b8;">CUIT inexistente (404)</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function setTestCUIT(cuit) {
            document.getElementById('cuit').value = cuit;
        }

        async function testAPI() {
            const cuit = document.getElementById('cuit').value.trim();
            const resultDiv = document.getElementById('result');

            if (!cuit) {
                resultDiv.innerHTML = '<div class="result error"><strong>Error:</strong> Ingrese un CUIT válido</div>';
                return;
            }

            if (!/^\d{11}$/.test(cuit)) {
                resultDiv.innerHTML = '<div class="result error"><strong>Error:</strong> El CUIT debe tener exactamente 11 dígitos</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading">🔄 Consultando API del BCRA...</div>';

            try {
                console.log('🚀 Iniciando consulta para CUIT:', cuit);

                const startTime = Date.now();
                const response = await fetch(`https://api.bcra.gob.ar/centraldedeudores/v1.0/Deudas/${cuit}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                        'User-Agent': 'DeudaCheck-Test/1.0',
                    },
                    signal: AbortSignal.timeout(15000) // 15 segundos timeout
                });

                const endTime = Date.now();
                const duration = endTime - startTime;

                console.log('📊 Status:', response.status);
                console.log('📊 Headers:', Object.fromEntries(response.headers.entries()));
                console.log('⏱️ Duración:', duration + 'ms');

                let resultHtml = `
                    <div class="result ${response.ok || response.status === 404 ? 'success' : 'error'}">
                        <strong>Status:</strong> ${response.status} ${response.statusText}<br>
                        <strong>Tiempo de respuesta:</strong> ${duration}ms<br>
                        <strong>Headers:</strong><br>
                        <pre>${JSON.stringify(Object.fromEntries(response.headers.entries()), null, 2)}</pre>
                `;

                if (response.ok) {
                    const data = await response.json();
                    console.log('📦 Datos recibidos:', data);

                    resultHtml += `
                        <strong>Datos:</strong><br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else if (response.status === 404) {
                    // 404 significa sin deudas - caso exitoso
                    resultHtml += `
                        <strong>Resultado:</strong> ✅ No se encontraron deudas registradas (caso exitoso - mostrará verde)<br>
                        <strong>Nota:</strong> En la aplicación real, esto se maneja como "sin deudas" y muestra verde.
                    `;
                } else {
                    const errorText = await response.text();
                    console.error('❌ Error response:', errorText);

                    resultHtml += `
                        <strong>Error:</strong><br>
                        <pre>${errorText}</pre>
                    `;
                }

                resultHtml += '</div>';
                resultDiv.innerHTML = resultHtml;

            } catch (error) {
                console.error('❌ Error de conexión:', error);

                let errorMessage = 'Error desconocido';
                if (error.name === 'TimeoutError') {
                    errorMessage = 'Timeout: La consulta tardó demasiado tiempo';
                } else if (error.message.includes('fetch')) {
                    errorMessage = 'Error de conexión: No se pudo conectar con la API';
                } else if (error.message.includes('CORS')) {
                    errorMessage = 'Error CORS: La API no permite consultas desde navegadores';
                } else {
                    errorMessage = error.message;
                }

                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>Error de conexión:</strong> ${errorMessage}<br>
                        <strong>Detalles técnicos:</strong><br>
                        <pre>${error.stack || error}</pre>
                    </div>
                `;
            }
        }

        // Permitir presionar Enter en el input
        document.getElementById('cuit').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                testAPI();
            }
        });
    </script>
</body>
</html>
